<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json"><link rel="icon" href="star-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0a1330"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star — Projeto fictício</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--line:#dde3f0;--txt:#0e1630;--mut:#5b688a;--gold:#e5a417;--goldt:#1d1400;--mint:#0c8f69;--rose:#d0314c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070c1b;--card:#111a33;--line:#223056;--txt:#eaf0ff;--mut:#94a2c8;--gold:#ffc14d;--goldt:#241800;--mint:#4de0b0;--rose:#ff7088}}
:root[data-theme="dark"]{--bg:#070c1b;--card:#111a33;--line:#223056;--txt:#eaf0ff;--mut:#94a2c8;--gold:#ffc14d;--goldt:#241800;--mint:#4de0b0;--rose:#ff7088}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 'DM Sans',system-ui,sans-serif;min-height:100%}
h1,h2,h3,.bal{font-family:Sora,'DM Sans',system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px;font:800 20px Sora,sans-serif}
.logo svg{width:30px;height:30px}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.hero,.plastic{color:#fff;border-radius:20px;padding:22px;margin-bottom:14px;background:radial-gradient(circle at 85% 18%,#ffffff40 0 1.5px,transparent 2px) 0 0/34px 34px,radial-gradient(circle at 20% 70%,#ffc14d55 0 1px,transparent 2px) 0 0/52px 52px,linear-gradient(145deg,#16275a,#0a1330)}
.hero .mut,.plastic .mut{color:#b8c4ea}
.bal{font-size:34px;font-weight:800;margin:4px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.act{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;cursor:pointer;font-weight:700;font-size:13px;display:grid;gap:6px;justify-items:center}
.act span{font-size:20px}
.act:hover{border-color:var(--gold)}
.btn{background:var(--gold);color:var(--goldt);border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.5}
.ic{background:#ffffff1f;border:0;border-radius:10px;color:#fff;padding:6px 10px;cursor:pointer}
.pill{display:inline-flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px}
.pill button{border:0;background:transparent;border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--mut)}
.pill button[aria-pressed=true]{background:var(--gold);color:var(--goldt);font-weight:700}
.tx{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;cursor:pointer}
.tx:last-child{border:0}
.in{color:var(--mint)}.out{color:var(--txt)}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold)}
label{display:grid;gap:5px;font-size:13px;font-weight:700;margin-bottom:12px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=range]{padding:0;accent-color:var(--gold)}
input[type=checkbox]{width:auto}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}
.err{color:var(--rose);min-height:1.2em;margin:0 0 8px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:transparent;border:0;border-radius:10px;padding:8px 4px;cursor:pointer;color:var(--mut);font-size:12px;display:grid;justify-items:center;gap:2px}
nav button span{font-size:18px}
nav button[aria-current=page]{color:var(--txt);font-weight:700;background:var(--bg);box-shadow:inset 0 -3px var(--gold)}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:#000a}
dialog h2{margin-bottom:12px}
dl{margin:0}dl div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
#toast{position:fixed;left:12px;right:12px;bottom:84px;display:grid;gap:8px;justify-items:center;z-index:20;pointer-events:none}
#toast div{background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 6px 24px #0006}
.auth{max-width:420px;margin:6vh auto 0}
.demo{background:#ffc14d22;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.av{width:38px;height:38px;border-radius:50%;border:0;background:var(--gold);color:var(--goldt);font-weight:800;cursor:pointer}
.ab{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#ffc14d40,#ffc14d10);color:var(--gold);border:1px solid #ffc14d40}
.act{transition:transform .15s,border-color .15s,box-shadow .15s;box-shadow:0 8px 22px -16px #0e163066}.act:hover{transform:translateY(-3px);box-shadow:0 12px 26px -14px #ffc14d88}
.tb{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:var(--bg);border:1px solid var(--line)}.tb.in{color:var(--mint)}.tb.out{color:var(--gold)}
.tx{align-items:center;gap:12px}.tt{flex:1;min-width:0}.tx:hover{background:var(--bg)}
.i{display:block}.sp{fill:var(--gold);stroke:none}.ic svg{display:block}
.hero{box-shadow:0 22px 44px -22px #0a1330cc}.hero .bal{background:linear-gradient(90deg,#fff,#ffe3a6);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{box-shadow:0 8px 24px -18px #0e163055}
.chip{width:46px;height:34px;border-radius:7px;margin-top:26px;background:linear-gradient(135deg,#ffe3a6,#d9961a);position:relative}.chip:after{content:'';position:absolute;inset:7px 9px;border:1.5px solid #8a5a0a66;border-radius:3px}
nav button svg{transition:transform .15s}nav button[aria-current=page] svg{transform:translateY(-2px);color:var(--gold)}
@media(min-width:760px){nav{position:static;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}.wrap{padding-bottom:30px}#toast{bottom:20px}}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;gap:14px;background:radial-gradient(circle at 50% 40%,#16275a,#070c1b 70%);color:#fff;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:96px;height:96px;filter:drop-shadow(0 0 18px #ffc14d99);animation:spin 1.3s cubic-bezier(.2,.8,.2,1) both}
#splash b{font:800 34px Sora,sans-serif;letter-spacing:.5px;animation:rise .8s .5s both}
#splash small{color:#b8c4ea;animation:rise .8s .8s both}
#splash i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffc14d;animation:tw 1.6s ease-in-out infinite}
@keyframes spin{from{transform:scale(.2) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes tw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.6)}}
main{animation:rise .5s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){#splash img,#splash b,#splash small{animation-name:fade}#splash i,main{animation:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><i style="left:15%;top:20%;animation-delay:0s"></i><i style="left:80%;top:15%;animation-delay:0.4s"></i><i style="left:70%;top:70%;animation-delay:0.9s"></i><i style="left:22%;top:75%;animation-delay:0.6s"></i><i style="left:50%;top:10%;animation-delay:1.1s"></i><i style="left:90%;top:50%;animation-delay:0.2s"></i><i style="left:8%;top:50%;animation-delay:0.8s"></i><img src="star-icon.svg" alt="" width="96" height="96"><b>Star</b><small>Projeto fictício</small></div>
<div class="wrap" id="app"></div>

<script type="module">

const K='starbank.v2';
const P={
home:'<path d="M3.5 11.2L12 4l8.5 7.2V19a1.5 1.5 0 0 1-1.5 1.5h-4v-5.2h-6v5.2H5A1.5 1.5 0 0 1 3.5 19z"/>',

loan:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7v10M14.6 9.4c-.6-.8-1.5-1.2-2.6-1.2-1.5 0-2.6.8-2.6 2s1.1 1.6 2.6 1.9 2.6.8 2.6 2-1.1 2-2.6 2c-1.1 0-2-.4-2.7-1.2"/>',

const ic=(n,s=22,sp)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}${sp?'<path class="sp" d="M19.500 1.500l.9 2.100 2.100.9-2.100.9-.9 2.100-.9-2.100-2.100-.9 2.100-.9z"/>':''}</svg>`;
const txi=t=>/Pix/.test(t)?'pix':/Dep|Bônus/.test(t)?'dep':/Boleto/.test(t)?'boleto':/Recarga/.test(t)?'rech':/[Cc]ofre/.test(t)?'vault':/Empr|Parcela/.test(t)?'loan':'card';
let db,u,tab='home',flt='all',authTab='login';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const toC=v=>Math.round(parseFloat(String(v).replace(',','.'))*100);
const when=t=>new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
function load(){try{db=JSON.parse(localStorage.getItem(K))||{users:{},s:null,last:''}}catch(e){db={users:{},s:null,last:''}}}
let cid=null,net=0,inc=[],pending=null,unsub=null;
const MAIL='@star.app';
function wire(){if(!u)return;const d=Object.getOwnPropertyDescriptor(u,'balance');if(d&&'value' in d)u.b0=d.value;if(!d||'value' in d)Object.defineProperty(u,'balance',{get(){return this.b0+net},set(v){this.b0=v-net},configurable:true,enumerable:false})}

 if(u&&cid){setDoc(doc(fs,'users',cid),JSON.parse(JSON.stringify(u))).catch(()=>toast('Sem conexão: não foi salvo.'));setDoc(doc(fs,'accounts',cid),{n:u.name,pix:u.pix.toLowerCase()}).catch(()=>{})}}
const hist=()=>[...u.tx,...inc.map(x=>({id:'x'+x.id,t:'Pix recebido',d:'De '+x.fn+(x.d?' · '+x.d:''),c:x.c,k:'in',at:x.at}))].sort((a,b)=>b.at-a.at);
const fit=f=>new Promise((ok,no)=>{const i=new Image(),r=new FileReader();r.onload=()=>{i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(i.width,i.height);c.width=c.height=96;c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
function setup(){$('#app').innerHTML=`<main class="auth"><section class="hero" style="text-align:center"><h1 style="font-size:24px">Configurar servidor</h1><p class="mut">Cole aqui o bloco <b>firebaseConfig</b> que o Firebase mostrou ao registrar o app Web.</p></section><div class="card"><form id="sf"><label>Texto do firebaseConfig<textarea name="t" rows="9" required style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font:13px monospace"></textarea></label><p class="err" id="se" role="alert"></p><button class="btn" style="width:100%">Salvar e abrir</button></form></div></main>`;
 $('#sf').onsubmit=e=>{e.preventDefault();const t=new FormData(e.target).get('t'),c={};for(const k of['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId']){const m=t.match(new RegExp(k+'\\s*[:=]\\s*["\']([^"\']+)["\']'));if(m)c[k]=m[1]}if(!c.apiKey||!c.projectId)return $('#se').textContent='Não encontrei apiKey e projectId no texto colado.';localStorage.setItem('star.fb',JSON.stringify(c));location.reload()}}
function boot(){load();if(firebaseConfig.apiKey==='COLE_AQUI'){setup();return}render();
 onAuthStateChanged(auth,async us=>{if(unsub){unsub();unsub=null}
  if(!us){cid=null;u=null;inc=[];net=0;render();return}

   if(sn.exists())u=sn.data();else if(pending){u=pending;pending=null;wire();save()}else{signOut(auth);return}
   wire();
   unsub=onSnapshot(query(collection(fs,'transfers'),where('to','==',cid)),q=>{inc=q.docs.map(x=>({id:x.id,...x.data()}));const n=inc.reduce((a,x)=>a+x.c,0),ch=n!==net;net=n;if(u&&ch)render()},()=>{});
   tab='home';render()}catch(e){toast('Sem conexão com o servidor.')}})}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function cpfOk(c){c=c.replace(/\D/g,'');if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10%11)%10!=c[t])return false}return true}
const mCpf=v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');

/* ---------- Formulário genérico em <dialog> ---------- */
function form(title,fields,ok,fn,note){

  const f=$('#f');
  f.onsubmit=async e=>{e.preventDefault();const r=await fn(Object.fromEntries(new FormData(f)));if(r)$('#fe').textContent=r;else d.close()};
  d.showModal();
}
const amt={t:'number',a:'step="0.01" min="0.01" required inputmode="decimal"'};

const A={
  pix(){form('Enviar Pix',[{n:'k',l:'Chave Pix',a:'required placeholder="ID Star do destinatário"'},{n:'v',l:'Valor (R$)',...amt},{n:'d',l:'Mensagem (opcional)',a:'maxlength="60"'},pwF],'Enviar',async v=>{

    try{const q=await getDocs(query(collection(fs,'accounts'),where('pix','==',v.k.trim().toLowerCase())));const f=q.docs.find(x=>x.id!==cid);if(!f)return'Esta chave não pertence a nenhuma conta Star.';await addDoc(collection(fs,'transfers'),{from:cid,to:f.id,c,fn:u.name,d:v.d||'',at:Date.now()})}catch(e){return'Sem conexão com o servidor. Tente de novo.'}u.balance-=c;tx('Pix enviado',`Para ${v.k.trim()} (${kind})${v.d?' · '+v.d:''}`,c,'out');commit();toast('Pix de '+brl(c)+' enviado.')},'Simulação: nenhum dinheiro real é movimentado.')},
  dep(){form('Adicionar saldo (demo)',[{n:'v',l:'Valor (R$)',...amt,a:'step="0.01" min="1" max="5000" required'}],'Adicionar',v=>{const c=toC(v.v);if(!(c>=100&&c<=500000))return'Informe de R$ 1 a R$ 5.000.';u.balance+=c;tx('Depósito','Saldo de demonstração',c,'in');commit();toast(brl(c)+' adicionados.')})},
  boleto(){form('Pagar boleto',[{n:'b',l:'Código de barras (47 ou 48 dígitos)',a:'required inputmode="numeric"'},{n:'v',l:'Valor (R$)',...amt},pwF],'Pagar',async v=>{const d=v.b.replace(/\D/g,''),c=toC(v.v);if(d.length!==47&&d.length!==48)return'O código deve ter 47 ou 48 dígitos.';if(!(c>0))return'Valor inválido.';if(c>u.balance)return'Saldo insuficiente.';if(!await okPw(v.pw))return bad;u.balance-=c;tx('Boleto pago','Final …'+d.slice(-6),c,'out');commit();toast('Boleto pago.')})},
  rech(){form('Recarga de celular',[{n:'op',l:'Operadora',opts:['Vivo','Claro','TIM','Oi'].map(x=>[x,x])},{n:'v',l:'Valor',opts:[1500,2000,3000,5000].map(x=>[x,brl(x)])}],'Recarregar',v=>{const c=+v.v;if(c>u.balance)return'Saldo insuficiente.';u.balance-=c;tx('Recarga de celular',v.op,c,'out');commit();toast('Recarga realizada.')})},
  newbox(){form('Novo cofre',[{n:'n',l:'Nome do cofre',a:'required maxlength="30"'},{n:'v',l:'Valor inicial (R$)',...amt,a:'step="0.01" min="0" required'}],'Criar',v=>{const c=toC(v.v)||0;if(!v.n.trim())return'Dê um nome ao cofre.';if(c>u.balance)return'Saldo insuficiente.';u.balance-=c;u.boxes.push({id:rid(),n:v.n.trim(),c});if(c)tx('Cofre criado',v.n.trim(),c,'out');commit()})},
  boxin(id){const b=u.boxes.find(x=>x.id===id);form('Guardar em '+b.n,[{n:'v',l:'Valor (R$)',...amt}],'Guardar',v=>{const c=toC(v.v);if(!(c>0))return'Valor inválido.';if(c>u.balance)return'Saldo insuficiente.';u.balance-=c;b.c+=c;tx('Guardado no cofre',b.n,c,'out');commit()})},
  boxout(id){const b=u.boxes.find(x=>x.id===id);form('Resgatar de '+b.n,[{n:'v',l:'Valor (R$)',...amt}],'Resgatar',v=>{const c=toC(v.v);if(!(c>0))return'Valor inválido.';if(c>b.c)return'O cofre não tem esse valor.';b.c-=c;u.balance+=c;tx('Resgate do cofre',b.n,c,'in');commit()})},
  buy(){form('Simular compra no cartão',[{n:'l',l:'Loja',a:'required maxlength="40"'},{n:'v',l:'Valor (R$)',...amt}],'Comprar',v=>{const c=toC(v.v);if(u.locked)return'Cartão bloqueado.';if(!(c>0))return'Valor inválido.';if(c>u.limit-u.used)return'Acima do limite disponível.';u.used+=c;tx('Compra no cartão',v.l.trim(),c,'out');u.tx[0].card=1;commit()},'A compra entra na fatura, não no saldo.')},
  inv(){if(u.used<=0)return toast('Sua fatura está zerada.');if(u.used>u.balance)return toast('Saldo insuficiente para pagar a fatura.');const c=u.used;u.balance-=c;u.used=0;tx('Fatura paga','StarCard',c,'out');commit();toast('Fatura paga.')},
  lock(){u.locked=!u.locked;commit();toast(u.locked?'Cartão bloqueado.':'Cartão desbloqueado.')},
  loan(){const p=+$('#lamt').value,n=+$('#lmo').value;if(u.loan)return toast('Você já tem um empréstimo ativo.');
    form('Contratar empréstimo',[pwF],'Contratar',async v=>{if(!await okPw(v.pw))return bad;u.loan={p,n,pm:pmt(p,n),paid:0};u.balance+=p;tx('Empréstimo creditado',`${n}x de ${brl(u.loan.pm)}`,p,'in');commit();toast('Empréstimo creditado.')},`Você receberá ${brl(p)} e pagará ${n}x de ${brl(pmt(p,n))}.`)},
  pay(){const L=u.loan;if(!L)return;if(L.pm>u.balance)return toast('Saldo insuficiente para a parcela.');u.balance-=L.pm;L.paid++;tx('Parcela do empréstimo',`${L.paid}/${L.n}`,L.pm,'out');if(L.paid>=L.n){u.loan=null;toast('Empréstimo quitado!')}else toast('Parcela paga.');commit()},
  prof(){form('Seu perfil',[{n:'ph',l:'Foto de perfil (opcional)',t:'file',a:'accept="image/*"'},{n:'n',l:'Nome',a:`required maxlength="60" value="${esc(u.name)}"`},{n:'k',l:'Chave Pix principal',a:`required value="${esc(u.pix)}"`},{n:'c',l:'Nome no cartão',a:`required maxlength="26" value="${esc(u.card)}"`}],'Salvar',async v=>{if(!keyKind(v.k))return'Chave Pix inválida.';if(v.ph&&v.ph.size){try{u.photo=await fit(v.ph)}catch(e){return'Imagem inválida.'}}u.name=v.n.trim();u.pix=v.k.trim();u.card=v.c.trim().toUpperCase();commit();toast('Perfil atualizado.')},`<button type="button" class="btn ghost sm" data-act="out">Sair da conta</button> <button type="button" class="btn ghost sm" data-act="wipe">Apagar conta</button>`)},
  out(){signOut(auth);$('#dlg').close()},
  wipe(){form('Apagar minha conta',[pwF],'Apagar para sempre',async v=>{if(!await okPw(v.pw))return bad;try{await deleteDoc(doc(fs,'users',cid));await deleteDoc(doc(fs,'accounts',cid));await deleteUser(auth.currentUser)}catch(e){return'Não foi possível apagar agora. Tente de novo.'}toast('Conta apagada.')},'Isso remove sua conta, saldo, cofres e extrato deste navegador. Não dá para desfazer.')},
  clear(){if(confirm('Apagar TODAS as contas e dados do StarBank neste navegador? Não dá para desfazer.')){db={users:{},s:null,last:''};u=null;save();render();toast('Dados apagados.')}},
  close(){$('#dlg').close()},
  tab(el){tab=el.dataset.v;render()},
  flt(el){flt=el.dataset.v;render()},
  eye(){u.hidden=!u.hidden;commit()},
  rc(el){const t=hist().find(x=>x.id===el.dataset.v);if(!t)return;$('#dlg').innerHTML=`<h2>Comprovante</h2><dl><div><dt>Tipo</dt><dd>${esc(t.t)}</dd></div><div><dt>Valor</dt><dd>${brl(t.c)}</dd></div><div><dt>Data</dt><dd>${when(t.at)}</dd></div><div><dt>Detalhes</dt><dd>${esc(t.d)}</dd></div><div><dt>Código</dt><dd>${esc(t.id.toUpperCase())}</dd></div></dl><p class="row"><span></span><button class="btn" data-act="close">Fechar</button></p>`;$('#dlg').showModal()},
  box(el){A[el.dataset.m](el.dataset.v)},
  reg(){authTab='register';render()},log(){authTab='login';render()}
};

/* ---------- Telas ---------- */
const logo=`<span class="logo"><img src="star-icon.svg" alt="" width="30" height="30">Star</span>`;
function authView(){
  const r=authTab==='register';
  $('#app').innerHTML=`<main class="auth"><section class="hero" style="text-align:center;padding:30px 20px"><span style="color:#ffc14d">${ic('star',46)}</span><h1 style="font-size:30px;margin-top:6px">Star</h1><p class="mut" style="margin:4px 0 0">${r?'Abra sua conta em menos de um minuto.':'Bem-vindo de volta. Entre na sua conta.'}</p></section><div class="demo"><b>Projeto fictício, sem dinheiro real.</b> Não use CPF, documentos ou dados pessoais reais. Sua conta fica salva no servidor e funciona em qualquer aparelho.</div><div class="card"><div class="pill" role="group" aria-label="Acesso" style="display:flex;margin-bottom:16px"><button type="button" style="flex:1" data-act="log" aria-pressed="${!r}">Entrar</button><button type="button" style="flex:1" data-act="reg" aria-pressed="${r}">Criar conta</button></div><form id="af">${r?`<label>Nome ou apelido<input name="n" required maxlength="60" autocomplete="name"></label>`:''}<label>ID Star${r?' (invente um apelido; não use documentos reais)':''}<input name="c" required minlength="4" maxlength="20" pattern="[A-Za-z0-9_.]{4,20}" placeholder="ex: lucas.star" autocapitalize="none" autocomplete="username" value="${r?'':esc(db.last||'')}"></label>${r?``:''}<label>Senha${r?' (mín. 8 caracteres)':''}<input name="p" type="password" required minlength="${r?8:1}" autocomplete="${r?'new-password':'current-password'}"></label>${r?'':`<label class="chk"><input type="checkbox" name="rem" ${db.last?'checked':''}> Lembrar meu ID</label>`}<p class="err" id="ae" role="alert"></p><button class="btn" style="width:100%">${r?'Abrir conta':'Entrar'}</button></form>${Object.keys(db.users).length?'<p style="text-align:center;margin:6px 0 0"><button type="button" class="btn ghost sm" data-act="clear">Apagar todos os dados deste navegador</button></p>':''}</div></main>`;
  $('#af').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),k=v.c.trim().toLowerCase(),er=m=>$('#ae').textContent=m;
    if(!/^[a-z0-9_.]{4,20}$/.test(k))return er('ID inválido: use de 4 a 20 letras, números, _ ou .');
    try{if(r){pending={name:v.n.trim(),pix:k,card:v.n.trim().toUpperCase().slice(0,26),num:String(1000+Math.floor(Math.random()*9000)),balance:100000,limit:600000,used:0,locked:false,hidden:false,boxes:[],tx:[{id:rid(),t:'Bônus de boas-vindas',d:'Saldo de demonstração',c:100000,k:'in',at:Date.now()}],loan:null};await createUserWithEmailAndPassword(auth,k+MAIL,v.p)}
      else await signInWithEmailAndPassword(auth,k+MAIL,v.p);
      db.last=v.rem?k:'';save()}
    catch(x){pending=null;er(x.code==='auth/email-already-in-use'?'Já existe uma conta com este ID.':x.code==='auth/weak-password'?'Senha fraca (mínimo 8 caracteres).':x.code==='auth/network-request-failed'?'Sem internet.':'ID ou senha incorretos.')}};
}
const tabs=[['home','home','Início'],['card','card','Cartão'],['boxes','vault','Cofres'],['loan','loan','Crédito']];
function shell(body){
  const ini=u.name.trim().split(/\s+/).map((x,i,a)=>i==0||i==a.length-1?x[0]:'').join('').toUpperCase();
  $('#app').innerHTML=`<header>${logo}<button class="av" data-act="prof" aria-label="Abrir perfil de ${esc(u.name)}">${u.photo?`<img src="${u.photo}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block">`:esc(ini)}</button></header><nav aria-label="Principal">${tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" ${tab===t[0]?'aria-current="page"':''}>${ic(t[1],22,tab===t[0])}${t[2]}</button>`).join('')}</nav><main>${body}</main><p class="mut sm" style="text-align:center;margin-top:8px">Projeto fictício · sem dinheiro real</p>`;
}
function home(){
  const L=hist().filter(t=>flt==='all'||t.k===flt);
  return`<section class="hero"><div class="row"><span class="mut">Olá, ${esc(u.name.split(' ')[0])}</span><button class="ic" data-act="eye" aria-label="${u.hidden?'Mostrar':'Ocultar'} saldo" aria-pressed="${u.hidden}">${ic(u.hidden?'eyeoff':'eye',20)}</button></div><div class="mut sm">Saldo disponível</div><div class="bal">${u.hidden?'R$ ••••••':brl(u.balance)}</div><div class="mut sm">Chave Pix: ${esc(u.pix)}${cid?' · ● online':''}</div></section>
<div class="grid4"><button class="act" data-act="pix"><span class="ab">${ic('pix',24)}</span>Pix</button><button class="act" data-act="dep"><span class="ab">${ic('dep',24)}</span>Depositar</button><button class="act" data-act="boleto"><span class="ab">${ic('boleto',24)}</span>Boleto</button><button class="act" data-act="rech"><span class="ab">${ic('rech',24)}</span>Recarga</button></div>
<section class="card"><div class="row"><h2 style="font-size:17px">Extrato</h2><div class="pill" role="group" aria-label="Filtrar">${[['all','Tudo'],['in','Entradas'],['out','Saídas']].map(f=>`<button data-act="flt" data-v="${f[0]}" aria-pressed="${flt===f[0]}">${f[1]}</button>`).join('')}</div></div>${L.length?L.map(t=>`<button class="tx" data-act="rc" data-v="${esc(t.id)}"><span class="tb ${t.k}">${ic(txi(t.t),20)}</span><span class="tt"><b>${esc(t.t)}</b><br><span class="mut sm">${esc(t.d)} · ${when(t.at)}</span></span><b class="${t.k}">${t.k==='in'?'+':'−'} ${brl(t.c)}</b></button>`).join(''):'<p class="mut" style="text-align:center">Nenhuma movimentação.</p>'}</section>`;
}
function cardV(){
  const free=u.limit-u.used,p=Math.min(100,u.limit?u.used/u.limit*100:0);
  return`<section class="plastic" style="${u.locked?'filter:grayscale(1)':''}"><div class="row"><b style="font-family:Sora;display:flex;gap:6px;align-items:center"><span style="color:#ffc14d">${ic('star',18)}</span>StarCard</b><span>${u.locked?'Bloqueado':'Ativo'}</span></div><div class="chip"></div><p style="font:20px/1 Sora;letter-spacing:3px;margin:16px 0 14px">•••• •••• •••• ${esc(u.num)}</p><div class="mut sm">${esc(u.card)}</div></section>
<section class="card"><div class="row"><span>Fatura atual</span><b>${brl(u.used)}</b></div><div class="bar" style="margin:10px 0"><i style="width:${p}%"></i></div><div class="row sm mut"><span>Disponível ${brl(free)}</span><span>Limite <b id="lv">${brl(u.limit)}</b></span></div>
<label style="margin-top:14px">Ajustar limite<input type="range" id="lim" min="${Math.max(50000,Math.ceil(u.used/10000)*10000)}" max="2000000" step="10000" value="${u.limit}"></label>
<div class="row"><button class="btn" data-act="inv">Pagar fatura</button><button class="btn ghost" data-act="buy">Simular compra</button><button class="btn ghost" data-act="lock">${u.locked?'Desbloquear':'Bloquear'} cartão</button></div></section>`;
}
function boxes(){
  const t=u.boxes.reduce((s,b)=>s+b.c,0);
  return`<section class="card"><div class="row"><div><div class="mut sm">Total nos cofres</div><div class="bal" style="font-size:26px">${brl(t)}</div></div><button class="btn" data-act="newbox">Novo cofre</button></div></section>${u.boxes.length?u.boxes.map(b=>`<section class="card row"><div><b>${esc(b.n)}</b><br><span class="mut">${brl(b.c)}</span></div><div class="row"><button class="btn sm" data-act="box" data-m="boxin" data-v="${esc(b.id)}">Guardar</button><button class="btn ghost sm" data-act="box" data-m="boxout" data-v="${esc(b.id)}">Resgatar</button></div></section>`).join(''):'<p class="mut">Crie cofres para separar dinheiro por objetivo.</p>'}`;
}
function loan(){
  const L=u.loan;
  return`<section class="card"><h2 style="font-size:17px;margin-bottom:12px">Simular empréstimo</h2><label>Valor: <b id="la">${brl(500000)}</b><input type="range" id="lamt" min="50000" max="2000000" step="50000" value="500000" style="width:100%"></label><label>Prazo<select id="lmo">${[6,12,24,36].map(n=>`<option ${n===12?'selected':''} value="${n}">${n} meses</option>`).join('')}</select></label><p id="lr" class="sm"></p><button class="btn" data-act="loan">Contratar</button><p class="sm mut">Taxa de 1,49% ao mês, tabela Price. Simulação sem valor contratual.</p></section>
${L?`<section class="card"><b>Empréstimo ativo</b><p class="mut">${brl(L.p)} · ${L.paid}/${L.n} parcelas pagas</p><div class="bar"><i style="width:${L.paid/L.n*100}%"></i></div><p><button class="btn" data-act="pay">Pagar parcela de ${brl(L.pm)}</button></p></section>`:''}`;
}
function render(){
  wire();
  if(!u)return authView();
  shell({home,card:cardV,boxes,loan}[tab]());
  if(tab==='loan')calcLoan();
}
function calcLoan(){const p=toC($('#lamt').value/100),n=+$('#lmo').value,m=pmt(p,n);$('#la').textContent=brl(p);$('#lr').innerHTML=`<b>${n}x de ${brl(m)}</b> · total ${brl(m*n)}`}

/* ---------- Eventos (delegação) ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&A[el.dataset.act])A[el.dataset.act](el.dataset.v&&el.dataset.act!=='tab'&&el.dataset.act!=='flt'&&el.dataset.act!=='rc'&&el.dataset.act!=='box'?el.dataset.v:el)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.mask==='cpf')t.value=mCpf(t.value);
  if(t.dataset&&t.dataset.mask==='tel')t.value=mTel(t.value);
  if(t.id==='lamt'||t.id==='lmo')calcLoan();
  if(t.id==='lim')$('#lv').textContent=brl(+t.value)});
document.addEventListener('change',e=>{if(e.target.id==='lim'){u.limit=+e.target.value;commit()}});

if(document.readyState!=='loading')boot();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const hide=()=>setTimeout(()=>{const x=document.getElementById('splash');if(x){x.classList.add('out');setTimeout(()=>x.remove(),600)}},2600);document.readyState==='complete'?hide():addEventListener('load',hide);setTimeout(()=>{const x=document.getElementById('splash');if(x)x.remove()},7000);
</script>
</body>
</html>
